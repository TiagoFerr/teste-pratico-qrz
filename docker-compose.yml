services:
  db:
    image: postgres:16-alpine
    container_name: portal_fornecedor_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-portal_fornecedor}
      TZ: America/Fortaleza
    command:
      - "postgres"
      - "-c"
      - "timezone=America/Fortaleza"
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-portal_fornecedor}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
